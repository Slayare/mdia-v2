[project]
name = "mdia"
version = "0.1.0"
description = "Memory-Driven Identity Agent: a closed-world simulation of persistent simulated individuals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
